name: Client wheel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build client wheel (${{ matrix.os }}, Python 3.15)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang perl
      - name: Pin Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Build and test installed client wheel
        run: |
          python -m pip install 'maturin==1.15.0' 'httpx==0.28.1'
          make -C bindings/client-python wheel PYTHON=python
          python -m pip install --no-index --no-deps bindings/client-python/dist/confido_client-0.2.0-*.whl
          python -m unittest discover -s bindings/client-python/tests -v
          python -c 'from confido_client.httpx_transport import ScopedTransport; print(ScopedTransport.__name__)'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-wheel-${{ matrix.os }}-py3.15
          path: bindings/client-python/dist/*.whl
          if-no-files-found: error

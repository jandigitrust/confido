name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    defaults:
      run:
        working-directory: confido
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: confido
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: confido/.python-version
      - name: Portable build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang perl
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Core and CLI
        run: |
          cargo test --locked --manifest-path verifier/Cargo.toml
          cargo test --locked --manifest-path client/Cargo.toml
          cargo build --locked --manifest-path cli/Cargo.toml
          python3 scripts/check_verifier_dependencies.py
      - name: Installed Python package
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install 'maturin==1.15.0' jsonschema playwright 'httpx==0.28.1'
          make -C bindings/python install PYTHON=python
          python -m unittest discover -s verifier/tests -v
          python -m unittest discover -s bindings/python/tests -v
          python -m unittest discover -s tests -v
      - name: Browser worker and MV3 extension
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          python3 extension/build.py
          python3 extension/build.py --browser firefox
          . .venv/bin/activate
          python -m playwright install --with-deps chromium firefox
          python scripts/browser_checks.py

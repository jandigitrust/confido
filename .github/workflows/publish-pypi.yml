name: Publish Python wheel to PyPI

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'pypi-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Build wheel (${{ matrix.os }}, Python 3.15)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Use the installed compiler without re-resolving optional components in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: '1.98.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            wheel_args: '--compatibility manylinux_2_35'
          - os: macos-15
            wheel_args: ''
          - os: macos-15-intel
            wheel_args: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: confido
          fetch-depth: 0
      - name: Require a main commit for release
        if: github.event_name == 'push'
        working-directory: confido
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: confido/.python-version
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl clang
      - name: Pin Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
      - name: Build and test the wheel
        working-directory: confido
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL_ARGS: ${{ matrix.wheel_args }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install 'maturin==1.15.0' 'tomli==2.4.1' jsonschema
          python - <<'PY'
          import os
          from pathlib import Path
          import tomli

          with Path('bindings/python/pyproject.toml').open('rb') as source:
              package = tomli.load(source)['project']
          with Path('bindings/python/Cargo.toml').open('rb') as source:
              crate = tomli.load(source)['package']
          version = package['version']
          if package['name'] != 'confido-verifier':
              raise SystemExit('Unexpected PyPI distribution name')
          if crate['version'] != version:
              raise SystemExit('Python and crate versions must match')
          if os.environ['RELEASE_TAG'].startswith('pypi-v') and os.environ['RELEASE_TAG'] != f'pypi-v{version}':
              raise SystemExit('Release tag and package version must match')
          PY
          make -C lib wheel PYTHON=python
          python -m pip install --no-index --no-deps bindings/python/dist/confido*.whl
          python -m unittest discover -s lib/tests -p 'test_*.py' -v
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheel-${{ matrix.os }}-py3.15
          path: confido/bindings/python/dist/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    name: Publish wheel
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Require PyPI token secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "Set PYPI_API_TOKEN as a GitHub Actions secret" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false

  check-token:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Check PyPI API token
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Verify PyPI accepts the GitHub secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import base64
          import os
          import re
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ.get('PYPI_API_TOKEN', '').strip()
          if not re.fullmatch(r'pypi-[A-Za-z0-9_-]{85,}', token):
              raise SystemExit('PYPI_API_TOKEN secret is missing or malformed')

          # No content field or package file is sent, so no release can be created.
          fields = {
              ':action': 'file_upload',
              'protocol_version': '1',
              'metadata_version': '2.1',
              'name': 'confido-verifier',
              'version': '0.2.0',
              'summary': 'Credential connectivity check',
              'filetype': 'bdist_wheel',
              'pyversion': 'cp315',
              'sha256_digest': '0' * 64,
          }
          credentials = base64.b64encode(f'__token__:{token}'.encode()).decode('ascii')
          request = Request(
              'https://upload.pypi.org/legacy/',
              data=urlencode(fields).encode('ascii'),
              headers={'Authorization': f'Basic {credentials}'},
              method='POST',
          )
          try:
              with urlopen(request, timeout=15) as response:
                  status = response.status
                  body = response.read(2048).decode('utf-8', errors='replace')
          except HTTPError as error:
              status = error.code
              body = error.read(2048).decode('utf-8', errors='replace')

          if status == 400 and 'Upload payload does not have a file' in body:
              print('PyPI accepted the GitHub token; no package was uploaded.')
          else:
              raise SystemExit(f'PyPI token check failed (HTTP {status})')
          PYCODE

[package]
license = "Apache-2.0"
repository = "https://github.com/jandigitrust/confido"
name = "confido-client"
version = "0.2.0"
edition = "2021"
[lib]
name = "confido_client"
[dependencies]
confido = { path = "../verifier" }
serde_json = "1"
base64 = "0.13"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
httpdate = "1"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
x509-parser = "=0.16.0"
[dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }

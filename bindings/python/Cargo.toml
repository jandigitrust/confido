[package]
license = "Apache-2.0"
repository = "https://github.com/jandigitrust/confido"
name = "confido-python"
version = "0.2.0"
edition = "2021"
[lib]
name = "confido_verifier"
crate-type = ["cdylib"]
[dependencies]
confido = { path = "../../lib" }
pyo3 = { version = "0.22.6", features = ["extension-module"] }
serde_json = "1"

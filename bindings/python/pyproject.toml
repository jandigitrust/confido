[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"
[project]
license = "Apache-2.0"
license-files = ["licenses/LICENSE", "licenses/THIRD_PARTY_NOTICES.md", "licenses/third-party-licenses.tar.gz"]
name = "confido-verifier"
requires-python = ">=3.15,<3.16"
version = "0.2.0"
description = "Local evidence verification without transport or admission"
[project.urls]
Repository = "https://github.com/jandigitrust/confido"
[tool.maturin]
bindings = "pyo3"
module-name = "confido_verifier"

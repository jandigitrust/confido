[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"
[project]
name = "confido-client"
version = "0.2.0"
description = "Caller-side evidence collection and peer-checked HTTPS"
license = "Apache-2.0"
license-files = ["licenses/LICENSE", "licenses/THIRD_PARTY_NOTICES.md", "licenses/third-party-licenses.tar.gz"]
requires-python = ">=3.10"
[project.optional-dependencies]
httpx = ["httpx>=0.27,<1"]
[project.urls]
Repository = "https://github.com/jandigitrust/confido"
[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "confido_client._native"

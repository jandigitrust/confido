[package]
name = "confido-client-python"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jandigitrust/confido"
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
confido_client = { package = "confido-cli", path = "../../client" }
pyo3 = { version = "0.22.6", features = ["extension-module"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
